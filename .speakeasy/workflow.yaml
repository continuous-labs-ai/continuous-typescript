workflowVersion: 1.0.0
speakeasyVersion: 1.796.4
sources:
    continuous-api:
        inputs:
            - location: registry.speakeasyapi.dev/continuous/continuous/continuous-api@main
        output: .speakeasy/out.openapi.yaml
targets:
    continuous-typescript:
        target: typescript
        source: continuous-api
        publish:
            npm:
                token: $npm_token
        codeSamples:
            registry:
                location: registry.speakeasyapi.dev/continuous/continuous/continuous-typescript-code-samples
            blocking: false
