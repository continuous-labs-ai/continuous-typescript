releaseNotes: "## Typescript SDK Changes:\n* `continuous.simulations.startSimulation()`: \n  *  `response` **Changed** (Breaking ⚠️)\n  *  `error.status[504]` **Removed** (Breaking ⚠️)\n* `continuous.simulations.createSimulation()`: \n  *  `request` **Changed** (Breaking ⚠️)\n  *  `response` **Changed** (Breaking ⚠️)\n  *  `error.status[504]` **Removed** (Breaking ⚠️)\n* `continuous.worlds.stopWorld()`:  `response` **Changed** (Breaking ⚠️)\n* `continuous.worlds.startWorld()`:  `response` **Changed** (Breaking ⚠️)\n* `continuous.simulationSnapshots.listSimulationSnapshots()`:  `response.simulationSnapshots[]` **Changed** (Breaking ⚠️)\n* `continuous.simulationSnapshots.createSimulationSnapshot()`: \n  *  `request` **Changed** (Breaking ⚠️)\n  *  `response` **Changed** (Breaking ⚠️)\n* `continuous.simulationSnapshots.getSimulationSnapshot()`:  `response` **Changed** (Breaking ⚠️)\n* `continuous.simulations.getSimulationToken()`:  `error.status[502]` **Removed** (Breaking ⚠️)\n* `continuous.simulations.stopSimulation()`:  `response` **Changed** (Breaking ⚠️)\n* `continuous.worlds.cancelWorld()`:  `response` **Changed** (Breaking ⚠️)\n* `continuous.worlds.buildWorld()`: \n  *  `request` **Changed** (Breaking ⚠️)\n  *  `response.status` **Changed**\n* `continuous.simulators.cloneSimulator()`:  `request` **Changed** (Breaking ⚠️)\n* `continuous.simulators.cancelSimulator()`:  `response` **Changed** (Breaking ⚠️)\n* `continuous.simulators.buildSimulator()`:  `request` **Changed** (Breaking ⚠️)\n* `continuous.simulators.deleteSimulator()`:  `error.dependents.snapshots` **Added**\n* `continuous.simulations.listSimulations()`: \n  *  `request.snapshotId` **Added**\n  *  `response.simulations[].status` **Changed**\n* `continuous.simulationSnapshots.updateSimulationSnapshot()`: **Added**\n* `continuous.worlds.listWorlds()`: \n  *  `request.status` **Changed**\n  *  `response.worlds[].status` **Changed**\n* `continuous.simulations.updateSimulation()`: **Added**\n* `continuous.worlds.getWorld()`:  `response.status` **Changed**\n* `continuous.simulations.getSimulation()`:  `response.status` **Changed**\n* `continuous.worlds.updateWorld()`: **Added**\n* `continuous.simulators.updateSimulator()`: **Added**\n"
